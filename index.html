<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101b46"><title>Sign Up | SMART TRADING</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="assets/app.js"></script></head>
<body data-page="signup"><main class="shell"><section class="authwrap"><div class="authbrand"><div class="brand"><span class="logo">ST</span> SMART TRADING</div></div>
<div class="panel"><form id="signupForm"><h1>Create your account</h1><p class="muted">Register to access SMART TRADING.</p>
<label for="fullName">Full name</label><input id="fullName" autocomplete="name" required>
<label for="signupEmail">Email address</label><input id="signupEmail" type="email" autocomplete="email" required>
<label for="signupPassword">Password</label><input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required>
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
<label for="referralInput">Referral code (optional)</label><input id="referralInput" placeholder="Enter referral code">
<button class="btn" id="signupBtn">Sign Up</button></form>
<form id="verifyForm" class="hidden"><h2>Verify your email</h2><p class="muted">Enter the 6-digit code sent to your email.</p><label>Email address</label><input id="verifyEmail" type="email" required><label>6-digit verification code</label><input id="verifyToken" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required><button class="btn" id="verifyBtn">Verify email</button></form>
<div id="authMsg" class="msg" role="status"></div><p class="muted small" style="text-align:center;margin:18px 0 0">Already registered? <a href="login.html">Log in</a></p></div></section></main></body></html>
